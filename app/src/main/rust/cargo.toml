[package]
name = "qcxr"
version = "0.0.1"
authors = [ "Flamgop" ]
edition = "2024"

[features]
default = ["loaded"]
loaded = ["openxr/loaded", "vk-graph/loaded"]
linked = ["openxr/linked", "vk-graph/linked"]

[dependencies]
android_logger = "0.15.1"
ndk = { version = "0.9.0", features = [ "media" ] }
ndk-sys = "0.6.0"
jni = "0.22"
log = "0.4.32"

bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck", "mint"] }
mint = "0.5"
openxr = { git = "https://github.com/Ralith/openxrs.git", rev = "294809e4fe7f6f9729c80526f5320d7d70408984", default-features = false, features = ["mint"] }
vk-graph = "0.14.3"

gltf = { version = "1.4", features = [ "extras", "names" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["staticlib", "dylib"]